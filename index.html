봄이 오면 매실밭은 온통 하얗게 물든다. 바람이 불 때마다 꽃잎이 눈처럼 흩날리고, 그 사이로 아이의 웃음소리가 섞여 들었다.
그녀는 오랫동안 잊고 있던 편지를 꺼내 들었다. 잉크는 번져 있었지만, 문장은 여전히 선명했다. “다시 오면, 그때는 꼭”

2장. 편지의 끝
비가 내리던 날, 우산을 쓰지 않고 걷는 것이 습관이 되었다. 빗방울이 어깨를 적시는 감각이 오히려 마음을 맑게 했다.

3장. 돌아오는 길

글자는 차갑지 않다. 손끝에서 만들어진 곡선은 사람의 온도를 기억한다. 활자의 온도는 종이의 결을 따라 스며든다.

1장. 활자의 숨
활자는 숨을 쉰다. 자간 사이로 공기가 흐르고, 행간 사이로 시간이 흐른다. 아름다운 문장은 읽는 사람의 호흡을 닮는다. 글자 사이의 여백이 의미를 만든다.
